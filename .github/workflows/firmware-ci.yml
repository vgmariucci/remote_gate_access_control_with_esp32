name: firmware-ci

on:
  push:
    branches: [main]
    paths: ['firmware/**', '.github/workflows/firmware-ci.yml']
  pull_request:
    paths: ['firmware/**', '.github/workflows/firmware-ci.yml']

# A new push to the same branch cancels the run still in flight. Without
# this, three pushes in five minutes means three full matrices billing
# in parallel.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# NOTE: this cannot be referenced from `jobs.<id>.container` — the env
# context is not available there. The image is hardcoded below and must
# be kept in step with this value and with the local install.
env:
  IDF_VERSION: v5.4.4

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: |
          sudo apt-get update && sudo apt-get install -y clang-format
          find firmware \( -name '*.c' -o -name '*.h' \) -print0 \
            | xargs -0 clang-format --dry-run --Werror

  host-tests:
    name: unit tests (linux target)
    runs-on: ubuntu-latest
    container: espressif/idf:v5.4.4
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build and run the host suite
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          cd firmware/host_test
          idf.py --preview set-target linux
          idf.py build
          # The ELF runs under the FreeRTOS linux port. If the scheduler
          # fails to tear down after UNITY_END the process never exits,
          # so cap it rather than letting the job sit for six hours.
          timeout --signal=KILL 120 ./build/access_core_host_test.elf

  build:
    name: build ${{ matrix.target }}
    runs-on: ubuntu-latest
    container: espressif/idf:v5.4.4
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [esp32s3]
    steps:
      - uses: actions/checkout@v4
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: idf.py build
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          cd firmware
          idf.py set-target ${{ matrix.target }}
          idf.py build
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: portao-firmware-${{ matrix.target }}
          path: |
            firmware/build/*.bin
            firmware/build/*.elf
          retention-days: 14